name: Publish release

on:
  workflow_dispatch:
    inputs:
      species:
        description: "Folder name: Wolf, Fox, Cat, Bear, Pig, Alligator, Crocodile, Butterfly, Donkey, Unicorn, Dragon, Kitsune, Griffin, Phoenix, Horse or Mystery"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checksums
        run: cd firmware && sha256sum -c SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SP: ${{ inputs.species }}
        run: |
          UP=$(echo "$SP" | tr a-z A-Z)
          grep " $SP/" firmware/SHA256SUMS.txt > "SHA256SUMS-$SP.txt"
          gh release create "$TAG" $(find firmware/$SP -type f ! -name '*.md' | sort) "SHA256SUMS-$SP.txt" \
            --title "Virtual Pet $SP $TAG (LODESTAR ORION, Heltec V4)" \
            --notes "A pocket $SP on a LODESTAR ORION radio. Heltec V4 (OLED) only.

          Which file?
          - US (miles per hour): ORION-${UP}_US-mph_...
          - EU, UK and elsewhere (km/h): ORION-${UP}_EU-UK-metric_...
          - fresh-install = first time on a radio. update = a radio that already has this pet.

          Flash with https://flasher.meshcore.io (Custom Firmware). Checksums are in SHA256SUMS-$SP.txt.

          Dashboard (watch the pet on a big screen) for LODESTAR ORION + Pet firmware: https://propertymonitor-web.github.io/lodestar_nova_alpha/ (Chrome or Edge, USB cable).

          Created by Aries Thorne & Todd Steinhauer. LODESTAR ORION by FEAR REACTIVE. Built on MeshCore."
